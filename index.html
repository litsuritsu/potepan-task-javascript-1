<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストップウォッチ</title>
    <!-- CSS読み込み -->
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h3>ストップウォッチ</h3>

        <!-- 時間表示エリア -->
        <div class="display">
            <p id="display">00:00:00.000</p>
        </div>

        <!-- ボタンエリア -->
        <div class="buttons">
            <button id="start-button">スタート</button>
            <button id="stop-button" disabled>ストップ</button>
            <button id="reset-button" disabled>リセット</button>
        </div>
    </div>


    <!-- JavaScript読み込み -->
    <script src="main.js"></script>
</body>
</html>
